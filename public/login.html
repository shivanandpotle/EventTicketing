<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sambhav Club</title>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WHDQ5XWRSB"></script>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="assets/sambhavFavicon.png">
</head>
<body>
    <div class="form-container">
        <div class="form-wrapper">
            <div class="form-header">
                <h2>Admin Login</h2>
                <p>Please enter your credentials to continue.</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div id="loginError" class="form-message error" style="display: none;"></div>
                <button type="submit" class="primary-btn form-btn">Login</button>
            </form>
             <div class="form-footer">
                <a href="/">← Back to Home</a>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
